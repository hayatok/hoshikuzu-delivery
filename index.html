<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>星屑デリバリー | Hoshikuzu Delivery</title>
<script>
window.__gameBooted = false;
window.addEventListener('error', function (e) {
  var box = document.getElementById('errbox');
  if (box) { box.style.display = 'block'; box.textContent = '⚠ 読み込みエラー: ' + (e.message || '不明なエラー'); }
}, true);
window.addEventListener('unhandledrejection', function (e) {
  var box = document.getElementById('errbox');
  if (box) { box.style.display = 'block'; box.textContent = '⚠ 読み込みエラー: ' + (e.reason && e.reason.message ? e.reason.message : e.reason); }
});
setTimeout(function () {
  if (!window.__gameBooted) {
    var box = document.getElementById('errbox');
    if (box && !box.textContent) { box.style.display = 'block'; box.textContent = '⚠ 3Dの初期化に失敗しました。お使いのブラウザがWebGL2に対応していない可能性があります。最新のSafari/Chromeで開いてみてください。'; }
  }
}, 8000);
</script>
  <script type="module" crossorigin src="./assets/index-BXI9HMsR.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-ugUPbsj7.css">
</head>
<body>
<div id="app"></div>
<div id="errbox" style="display:none;position:fixed;left:12px;right:12px;bottom:12px;z-index:99;background:#7a1030;color:#fff;padding:12px 16px;border-radius:10px;font-size:14px;line-height:1.5;"></div>

<div id="hud" class="hidden">
  <div class="hud-box">⭐ 星屑 <span id="count">0</span> / 8</div>
  <div class="hud-box">⏱ <span id="timer">120</span> 秒</div>
  <div id="message"></div>
  <div id="controls-hint">WASD / 矢印キー：移動　Shift：ダッシュ　Space：ホバージャンプ</div>
</div>

<div id="overlay">
  <h1>⭐ 星屑デリバリー ⭐</h1>
  <p>夕暮れの浮島に散らばった星屑（ほしくず）を 8つ 集めて、<br>制限時間内に灯台のビーコンへ届けよう！</p>
  <p class="hint">WASD / 矢印キー：移動<br>Shift：ダッシュ　Space：ホバージャンプ<br>スマホ・タブレット：画面左のスティックと右のボタンでも遊べます</p>
  <button id="start-btn">ゲームスタート</button>
</div>

<div id="end-screen" class="hidden">
  <h1 id="end-title">🎉 配達完了！</h1>
  <p id="end-text"></p>
  <button id="restart-btn">もう一度遊ぶ</button>
</div>

<div id="touch-controls" class="hidden">
  <div id="joystick"><div id="joystick-knob"></div></div>
  <div class="touch-buttons">
    <button id="btn-dash" type="button">ダッシュ</button>
    <button id="btn-jump" type="button">ジャンプ</button>
  </div>
</div>

</body>
</html>
